<script>
  // Persist scroll position in localStorage (per system guidelines for decks/video; applied here too)
  window.addEventListener('load', () => {
    const y = parseInt(localStorage.getItem('carter_scroll') || '0', 10);
    if (y > 0) window.scrollTo(0, y);
  });
  window.addEventListener('scroll', () => {
    localStorage.setItem('carter_scroll', String(window.scrollY));
  }, { passive: true });
</script>
